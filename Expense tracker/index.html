<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker Project</html></title>
  <style>
    .expense {
      margin-bottom: 10px;
    }

    .input-row {
      margin-bottom: 20px;
    }

    button {
      margin-left: 5px;
    }
  </style>
</head>
<body>
 
  <h2>Expense Tracker</h2>

  <div class="input-row">
    <label>Choose expense amount:</label>
    <input type="number" id="amount" placeholder="e.g. 100">

    <label>Choose description:</label>
    <input type="text" id="description" placeholder="e.g. Movie">

    <label>Choose a category:</label>
    <select id="category">
      <option value="Education">Education</option>
      <option value="Food">Food</option>
      <option value="Fuel">Fuel</option>
      <option value="Electricity">Electricity</option>
      <option value="Accommodation">Accommodation</option>
      
    </select>

    <button onclick="addExpense()">Add Expense</button>
  </div>

  <div id="expenseList"></div>

  <script>
    let expenses = [];

    function addExpense() {
      const amount = document.getElementById('amount').value.trim();
      const description = document.getElementById('description').value.trim();
      const category = document.getElementById('category').value;

      if (!amount || !description) {
        alert("Please enter both amount and description.");
        return;
      }

      const expense = {
        id: Date.now(),
        amount,
        description,
        category
      };

      expenses.push(expense);
      renderExpenses();
      clearInputs();
    }

    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      renderExpenses();
    }

    function editExpense(id) {
      const expense = expenses.find(e => e.id === id);
      document.getElementById('amount').value = expense.amount;
      document.getElementById('description').value = expense.description;
      document.getElementById('category').value = expense.category;
      deleteExpense(id);
    }

    function renderExpenses() {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';

      expenses.forEach(exp => {
        const div = document.createElement('div');
        div.className = 'expense';
        div.innerHTML = `
          • ${exp.amount} – ${exp.description} – ${exp.category}
          <button onclick="deleteExpense(${exp.id})">Delete Expense</button>
          <button onclick="editExpense(${exp.id})">Edit Expense</button>
          
        `;
        list.appendChild(div);
      });
    }

    function clearInputs() {
      document.getElementById('amount').value = '';
      document.getElementById('description').value = '';
      document.getElementById('category').value = 'Food';
    }
  </script>

</body>
</html>
